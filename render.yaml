services:
  - type: web
    name: callwave-hd-voice
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Generate and retain the production signing key in Render rather than
      # relying on a repository .env file at runtime.
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/health
